name: Build Android App Cloner APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/appcloner
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'GREOF' > settings.gradle
          include ':app'
          rootProject.name = "AppCloner"
          GREOF

          # 2. build.gradle (Root)
          cat << 'GREOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          GREOF

          # 3. app/build.gradle
          cat << 'GREOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.example.appcloner'
              compileSdk 33

              defaultConfig {
                  applicationId "com.example.appcloner"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.1'
          }
          GREOF

          # 4. AndroidManifest.xml
          cat << 'AMEOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.appcloner">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:label="ناسخ التطبيقات - App Cloner"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          AMEOF

          # 5. MainActivity.kt
          cat << 'KTEOF' > app/src/main/java/com/example/appcloner/MainActivity.kt
          package com.example.appcloner

          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream

          class MainActivity : AppCompatActivity() {

              private lateinit var recyclerView: RecyclerView
              private lateinit var adapter: AppListAdapter

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  recyclerView = findViewById(R.id.recyclerViewApps)
                  recyclerView.layoutManager = LinearLayoutManager(this)

                  checkPermissions()
                  loadInstalledApps()
              }

              private fun checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      if (!packageManager.canRequestPackageInstalls()) {
                          val intent = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES).apply {
                              data = Uri.parse("package:$packageName")
                          }
                          startActivity(intent)
                      }
                  }
              }

              private fun loadInstalledApps() {
                  val pm = packageManager
                  val packages = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                  val appList = ArrayList<AppInfoModel>()

                  for (app in packages) {
                      if ((app.flags and ApplicationInfo.FLAG_SYSTEM) == 0 || (app.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0) {
                          val name = pm.getApplicationLabel(app).toString()
                          val pkgName = app.packageName
                          val icon = pm.getApplicationIcon(app)
                          val sourceDir = app.sourceDir
                          appList.add(AppInfoModel(name, pkgName, icon, sourceDir))
                      }
                  }

                  adapter = AppListAdapter(appList) { selectedApp ->
                      cloneAndInstallApp(selectedApp)
                  }
                  recyclerView.adapter = adapter
              }

              private fun cloneAndInstallApp(app: AppInfoModel) {
                  Toast.makeText(this, "جاري تجهيز استنساخ: ${app.appName}...", Toast.LENGTH_SHORT).show()

                  Thread {
                      try {
                          val srcFile = File(app.sourceDir)
                          val destFile = File(cacheDir, "${app.packageName}_cloned.apk")
                          
                          FileInputStream(srcFile).use { input ->
                              FileOutputStream(destFile).use { output ->
                                  input.copyTo(output)
                              }
                          }

                          runOnUiThread {
                              installApk(destFile)
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                          runOnUiThread {
                              Toast.makeText(this, "حدث خطأ: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }.start()
              }

              private fun installApk(file: File) {
                  val uri: Uri = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                  } else {
                      Uri.fromFile(file)
                  }

                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION
                  }
                  startActivity(intent)
              }
          }
          KTEOF

          # 6. AppInfoModel.kt
          cat << 'KTEOF' > app/src/main/java/com/example/appcloner/AppInfoModel.kt
          package com.example.appcloner

          import android.graphics.drawable.Drawable

          data class AppInfoModel(
              val appName: String,
              val packageName: String,
              val icon: Drawable,
              val sourceDir: String
          )
          KTEOF

          # 7. AppListAdapter.kt
          cat << 'KTEOF' > app/src/main/java/com/example/appcloner/AppListAdapter.kt
          package com.example.appcloner

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          class AppListAdapter(
              private val appList: List<AppInfoModel>,
              private val onCloneClick: (AppInfoModel) -> Unit
          ) : RecyclerView.Adapter<AppListAdapter.AppViewHolder>() {

              class AppViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                  val imgIcon: ImageView = view.findViewById(R.id.imgAppIcon)
                  val txtName: TextView = view.findViewById(R.id.txtAppName)
                  val txtPackage: TextView = view.findViewById(R.id.txtPackageName)
                  val btnClone: Button = view.findViewById(R.id.btnClone)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): AppViewHolder {
                  val view = LayoutInflater.from(parent.context).inflate(R.layout.item_app, parent, false)
                  return AppViewHolder(view)
              }

              override fun onBindViewHolder(holder: AppViewHolder, position: Int) {
                  val item = appList[position]
                  holder.txtName.text = item.appName
                  holder.txtPackage.text = item.packageName
                  holder.imgIcon.setImageDrawable(item.icon)
                  holder.btnClone.setOnClickListener {
                      onCloneClick(item)
                  }
              }

              override fun getItemCount(): Int = appList.size
          }
          KTEOF

          # 8. XML Layouts & Values
          cat << 'XMLEOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <external-path name="external" path="." />
          </paths>
          XMLEOF

          cat << 'XMLEOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="ناسخ التطبيقات"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:layout_gravity="center"
                  android:layout_marginBottom="16dp" />

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/recyclerViewApps"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </LinearLayout>
          XMLEOF

          cat << 'XMLEOF' > app/src/main/res/layout/item_app.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:padding="10dp">

              <ImageView
                  android:id="@+id/imgAppIcon"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:layout_marginEnd="12dp" />

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical">

                  <TextView
                      android:id="@+id/txtAppName"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/txtPackageName"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textSize="12sp"
                      android:textColor="#777777" />
              </LinearLayout>

              <Button
                  android:id="@+id/btnClone"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="استنساخ" />

          </LinearLayout>
          XMLEOF

          cat << 'XMLEOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AppCloner</string>
          </resources>
          XMLEOF

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew

      - name: Build Android App (Assemble Debug APK)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppCloner-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "app-v${{ github.run_number }}"
          name: "App Cloner Android App v1.0.#${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
